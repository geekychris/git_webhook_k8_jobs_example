apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook-processor
  namespace: webhook-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-launcher
  namespace: webhook-demo
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webhook-processor-job-launcher
  namespace: webhook-demo
subjects:
  - kind: ServiceAccount
    name: webhook-processor
    namespace: webhook-demo
roleRef:
  kind: Role
  name: job-launcher
  apiGroup: rbac.authorization.k8s.io
