apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-processor
  namespace: webhook-demo
  labels:
    app: webhook-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-processor
  template:
    metadata:
      labels:
        app: webhook-processor
    spec:
      serviceAccountName: webhook-processor

      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"

      # Shared volumes between all containers in this pod
      volumes:
        - name: shared-data
          emptyDir: {}
        - name: credentials
          secret:
            secretName: webhook-credentials

      containers:
        # Main container: Spring Boot webhook processor
        - name: webhook-service
          image: webhook-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: K8S_NAMESPACE
              value: "webhook-demo"
            - name: JOB_IMAGE
              value: "job-processor:latest"
            - name: MAX_CONCURRENT_JOBS
              value: "2"
            - name: ENRICHMENT_URL
              value: "http://localhost:5000"
            - name: AUDIT_URL
              value: "http://localhost:5001"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: webhook-credentials
                  key: github-token
          volumeMounts:
            - name: shared-data
              mountPath: /shared/data
            - name: credentials
              mountPath: /shared/credentials
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15

        # Sidecar 1: Metadata enrichment service (Python)
        - name: enrichment-sidecar
          image: sidecar-enrichment:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: enrichment
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: webhook-credentials
                  key: github-token
            - name: SHARED_DATA_PATH
              value: "/shared/data"
          volumeMounts:
            - name: shared-data
              mountPath: /shared/data
            - name: credentials
              mountPath: /shared/credentials
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

        # Sidecar 2: Audit logging service (Python)
        - name: audit-sidecar
          image: sidecar-audit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
              name: audit
          env:
            - name: SHARED_DATA_PATH
              value: "/shared/data"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: webhook-credentials
                  key: api-key
          volumeMounts:
            - name: shared-data
              mountPath: /shared/data
            - name: credentials
              mountPath: /shared/credentials
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-processor
  namespace: webhook-demo
spec:
  type: NodePort
  selector:
    app: webhook-processor
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http
