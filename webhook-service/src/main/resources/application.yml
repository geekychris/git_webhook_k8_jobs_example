server:
  port: 8080

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

kubernetes:
  namespace: ${K8S_NAMESPACE:webhook-demo}

job:
  image: ${JOB_IMAGE:job-processor:latest}

consumer:
  max-concurrent-jobs: ${MAX_CONCURRENT_JOBS:2}

sidecar:
  enrichment:
    url: ${ENRICHMENT_URL:http://localhost:5000}
  audit:
    url: ${AUDIT_URL:http://localhost:5001}
